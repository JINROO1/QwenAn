name: android-proot

# Compila proot estático arm64 (para jniLibs) y prueba ptrace dentro de ubuntu:noble arm64.

on:
  workflow_dispatch:
  push:
    branches: [arena/e2e27cb5-qwenan]
    paths:
      - '.github/proot/**'
      - '.github/workflows/android-proot.yml'

permissions:
  contents: write # solo para subir libproot.so a la release runtime-v1 (manual)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Registrar emulación arm64
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Compilar proot estático y probarlo
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          RC=0
          docker run --rm --platform linux/arm64 \
            -v "$PWD/.github/proot:/work:ro" -v "$RUNNER_TEMP/out:/out" \
            --security-opt seccomp=unconfined \
            -e PROOT_TAG=v5.5.0 ubuntu:noble bash /work/build-proot.sh >"$RUNNER_TEMP/build.log" 2>&1 || RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::error::build o prueba de proot falló (rc=$RC): $(grep -v '^$' "$RUNNER_TEMP/build.log" | tail -n 12 | tr '\n' ' ' | tail -c 900)"
            exit 1
          fi
          grep '^::' "$RUNNER_TEMP/build.log" || true
          echo "::notice::proot arm64 estático OK"
          cp "$RUNNER_TEMP/out/proot" "$RUNNER_TEMP/out/libproot.so"

      - name: Subir libproot.so a la release runtime-v1 (solo manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          RC=0
          OUT=$(gh release upload runtime-v1 "$RUNNER_TEMP/out/libproot.so" --clobber 2>&1) || RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::error::subida a runtime-v1 falló (rc=$RC): $(echo "$OUT" | tr '\n' ' ' | cut -c1-600)"
            exit 1
          fi
          SHA=$(sha256sum "$RUNNER_TEMP/out/libproot.so" | cut -d' ' -f1)
          echo "::notice::libproot.so publicado en runtime-v1, sha256 $SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: qwenan-proot-arm64
          path: ${{ runner.temp }}/out/libproot.so
          retention-days: 7
