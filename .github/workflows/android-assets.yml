name: android-assets

# Paso 3 del plan Android: assets de runtime (Node 26.13.1 linux-arm64 y bundle de
# Qwen Code v0.28.0 con parches), troceados con SHA-256 y manifest. La CI reensambla
# los fragmentos y arranca qwen serve con el Node empaquetado.
# Se publican como artefacto. Resultados en anotaciones.

on:
  workflow_dispatch:
  push:
    branches: [arena/e2e27cb5-qwenan]
    paths:
      - '.github/workflows/android-assets.yml'
      - '.github/assets/**'
      - 'patches/qwen-code/**'

permissions:
  contents: read

jobs:
  rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Register arm64 emulation (binfmt)
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Build and verify rootfs
        run: bash .github/rootfs/build-rootfs.sh "$RUNNER_TEMP/rootfs-out"

      - name: Upload rootfs fragments and manifest
        uses: actions/upload-artifact@v4
        with:
          name: qwenan-rootfs-arm64
          path: ${{ runner.temp }}/rootfs-out/
          retention-days: 14
          if-no-files-found: error

  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Register arm64 emulation (binfmt)
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'

      - name: Build, package and verify assets
        run: bash .github/assets/build-assets.sh "$RUNNER_TEMP/assets-out"

      - name: Upload assets and manifest
        uses: actions/upload-artifact@v4
        with:
          name: qwenan-assets-arm64
          path: ${{ runner.temp }}/assets-out/
          retention-days: 14
          if-no-files-found: error

  release:
    # Solo manual: publica en el pre-release los fragmentos de runtime y rootfs, y un manifest fusionado.
    if: github.event_name == 'workflow_dispatch'
    needs: [assets, rootfs]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: runtime-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: qwenan-assets-arm64
          path: dl/assets

      - uses: actions/download-artifact@v4
        with:
          name: qwenan-rootfs-arm64
          path: dl/rootfs

      - name: Preparar publicación (fragmentos y manifest fusionado)
        run: |
          set -euo pipefail
          mkdir -p publish
          cp dl/assets/*.part-* dl/rootfs/*.part-* publish/
          python3 .github/assets/merge-manifest.py publish/manifest.json dl/assets/manifest.json dl/rootfs/manifest.json
          echo "::notice::publicación: $(ls publish | wc -l) archivos"

      - name: Crear o actualizar pre-release ${{ env.TAG }}
        run: |
          set -uo pipefail
          cd publish
          FILES=$(ls -1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            MODE=upload; RC=0
            OUT=$(gh release upload "$TAG" $FILES --clobber 2>&1) || RC=$?
          else
            MODE=create; RC=0
            OUT=$(gh release create "$TAG" $FILES --target "$GITHUB_SHA" --prerelease \
              --title "Runtime Android arm64 v1" \
              --notes "Node 26.13.1, Qwen Code v0.28.0 con parches 0001 y 0002, y rootfs Ubuntu noble arm64. Fragmentos de 64 MiB con SHA-256 en manifest.json." 2>&1) || RC=$?
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::$MODE de $TAG falló (rc=$RC): $(echo "$OUT" | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          echo "::notice::release $TAG ($MODE) OK: $(gh release view "$TAG" --json assets -q '.assets | length' 2>/dev/null) archivos"
