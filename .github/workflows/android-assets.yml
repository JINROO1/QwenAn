name: android-assets

# Paso 3 del plan Android: assets de runtime (Node 26.13.1 linux-arm64 y bundle de
# Qwen Code v0.28.0 con parches), troceados con SHA-256 y manifest. La CI reensambla
# los fragmentos y arranca qwen serve con el Node empaquetado.
# Se publican como artefacto. Resultados en anotaciones.

on:
  workflow_dispatch:
  push:
    branches: [arena/e2e27cb5-qwenan]
    paths:
      - '.github/workflows/android-assets.yml'
      - '.github/assets/**'
      - 'patches/qwen-code/**'

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Register arm64 emulation (binfmt)
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'

      - name: Build, package and verify assets
        run: bash .github/assets/build-assets.sh "$RUNNER_TEMP/assets-out"

      - name: Upload assets and manifest
        uses: actions/upload-artifact@v4
        with:
          name: qwenan-assets-arm64
          path: ${{ runner.temp }}/assets-out/
          retention-days: 14
          if-no-files-found: error

  release:
    # Solo manual: publica los fragmentos y el manifest como pre-release del repo.
    if: github.event_name == 'workflow_dispatch'
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: runtime-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: qwenan-assets-arm64
          path: assets

      - name: Create or update pre-release ${{ env.TAG }}
        run: |
          set -uo pipefail
          rm -f assets/chunk.py
          FILES=$(find assets -maxdepth 1 -type f | sort)
          echo "::notice::archivos a publicar: $(echo "$FILES" | wc -l)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            MODE=upload; RC=0
            OUT=$(gh release upload "$TAG" $FILES --clobber 2>&1) || RC=$?
          else
            MODE=create; RC=0
            OUT=$(gh release create "$TAG" $FILES --target "$GITHUB_SHA" --prerelease \
              --title "Runtime Android arm64 v1" \
              --notes "Node 26.13.1 linux-arm64 y Qwen Code v0.28.0 con parches 0001 y 0002. Fragmentos de 64 MiB con SHA-256 en manifest.json." 2>&1) || RC=$?
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::$MODE de $TAG falló (rc=$RC): $(echo "$OUT" | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          echo "::notice::release $TAG ($MODE) OK: $(gh release view "$TAG" --json assets -q '.assets | length' 2>/dev/null) archivos"
