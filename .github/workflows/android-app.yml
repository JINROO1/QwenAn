name: android-app

# Compila la app Android (debug) y ejecuta los unit tests del descargador.
# El APK se publica como artefacto de Actions; la distribución es personal (no Play).

on:
  workflow_dispatch:
  push:
    branches: [arena/e2e27cb5-qwenan]
    paths:
      - 'android/**'
      - '.github/workflows/android-app.yml'

permissions:
  contents: write # solo para publicar el APK de prueba en la release app-test

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK de Android (plataforma 34)
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "::notice::ANDROID_HOME=$SDK"
          RC=0
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/tmp/sdk.log 2>&1 || RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::error::sdkmanager falló (rc=$RC): $(tail -c 600 /tmp/sdk.log | tr '\n' ' ')"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Construir la Web Shell e incluirla en los assets del APK
        run: |
          set -euo pipefail
          cd webshell
          npm ci
          npm run build
          rm -rf ../android/app/src/main/assets
          mkdir -p ../android/app/src/main/assets
          cp -r dist/. ../android/app/src/main/assets/
          echo "::notice::Web Shell en assets: $(find ../android/app/src/main/assets -type f | wc -l) archivos"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Tests unitarios y APK debug
        working-directory: android
        run: |
          set -uo pipefail
          RC=0
          gradle --no-daemon testDebugUnitTest assembleDebug >/tmp/gradle.log 2>&1 || RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::error::build o tests Android fallaron (rc=$RC): $(grep -E 'e: |FAILED|What went wrong|Exception|error:' /tmp/gradle.log | head -8 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          echo "::notice::APK debug y tests OK"

      - uses: actions/upload-artifact@v4
        with:
          name: qwenan-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Publicar APK de prueba (solo manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" "$RUNNER_TEMP/qwenan-debug.apk"
          RC=0
          if gh release view app-test >/dev/null 2>&1; then
            OUT=$(gh release upload app-test "$RUNNER_TEMP/qwenan-debug.apk" --clobber 2>&1) || RC=$?
          else
            OUT=$(gh release create app-test "$RUNNER_TEMP/qwenan-debug.apk" --prerelease --target "$GITHUB_SHA" \
              --title "APK de prueba" --notes "APK debug para probar en dispositivo. No es una versión final." 2>&1) || RC=$?
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::publicar APK falló (rc=$RC): $(echo "$OUT" | tr '\n' ' ' | cut -c1-600)"
            exit 1
          fi
          echo "::notice::APK publicado en la release app-test"
