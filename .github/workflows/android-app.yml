name: android-app

# Compila la app Android (debug) y ejecuta los unit tests del descargador.
# El APK se publica como artefacto de Actions; la distribución es personal (no Play).

on:
  workflow_dispatch:
  push:
    branches: [arena/e2e27cb5-qwenan]
    paths:
      - 'android/**'
      - '.github/workflows/android-app.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK de Android (plataforma 34)
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "::notice::ANDROID_HOME=$SDK"
          RC=0
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/tmp/sdk.log 2>&1 || RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::error::sdkmanager falló (rc=$RC): $(tail -c 600 /tmp/sdk.log | tr '\n' ' ')"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Tests unitarios y APK debug
        working-directory: android
        run: |
          set -uo pipefail
          RC=0
          gradle --no-daemon testDebugUnitTest assembleDebug || RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::error::build o tests Android fallaron (rc=$RC)"
            exit 1
          fi
          echo "::notice::APK debug y tests OK"

      - uses: actions/upload-artifact@v4
        with:
          name: qwenan-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
