name: android-rootfs-spike

# Validación glibc arm64 con Docker + qemu (binfmt). Comprueba que Node
# 26.13.1 linux-arm64 (glibc) arranca dentro de una base Ubuntu arm64 y que
# apt funciona. No publica nada.

on:
  workflow_dispatch:
  push:
    branches: [arena/e2e27cb5-qwenan]
    paths:
      - '.github/workflows/android-rootfs-spike.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '26.13.1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Register arm64 emulation (binfmt)
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Download and verify Node ${{ env.NODE_VERSION }} (linux-arm64)
        run: |
          set -euo pipefail
          mkdir -p work && cd work
          BASE=https://nodejs.org/dist/v${NODE_VERSION}
          curl -fsSLO "$BASE/SHASUMS256.txt"
          NODE_TAR=node-v${NODE_VERSION}-linux-arm64.tar.xz
          curl -fsSLO "$BASE/$NODE_TAR"
          grep " $NODE_TAR\$" SHASUMS256.txt > node.sha256
          sha256sum -c node.sha256
          tar -xJf "$NODE_TAR"
          mv "node-v${NODE_VERSION}-linux-arm64" node

      - name: C1 pull and uname
        run: docker run --rm --platform linux/arm64 ubuntu:noble uname -m

      - name: C2 glibc version
        run: docker run --rm --platform linux/arm64 ubuntu:noble sh -c 'ldd --version | head -1'

      - name: C3 node -v (mounted linux-arm64 Node 26.13.1)
        run: |
          set +e
          docker run --rm --platform linux/arm64 -v "$PWD/work/node:/opt/node:ro" \
            ubuntu:noble sh -c 'apt-get update -qq && apt-get install -y -qq libatomic1 >/dev/null 2>&1; /opt/node/bin/node -v && /opt/node/bin/node -e "console.log(\"arch=\" + process.arch + \" v8=\" + process.versions.v8 + \" glibc-ok\")" && apt-get update -qq && apt-cache policy git python3 | head -8' > c3.out 2>&1
          rc=$?
          python3 -c "import sys,json; t=open('c3.out').read(); print('::error title=C3 rc=$rc::'+t.replace('%','%25').replace('\n','%0A').replace('\r',''))"
          exit $rc

      - name: C4 node runtime check
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD/work/node:/opt/node:ro" \
            ubuntu:noble /opt/node/bin/node -e 'console.log("arch=" + process.arch + " v8=" + process.versions.v8)'

      - name: C5 apt-get update
        run: docker run --rm --platform linux/arm64 ubuntu:noble apt-get update -qq
